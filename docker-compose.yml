version: '3.8'

services:
  bot:
    build: .
    container_name: btc_bot
    restart: unless-stopped
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./.env:/app/.env
    # Healthcheck to ensure bot is responsive
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
